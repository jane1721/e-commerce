version: '3'

services:
  mysql:
    image: mysql:8.0
    ports:
      - "13306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_USER=application
      - MYSQL_PASSWORD=application
      - MYSQL_DATABASE=ecommerce
    volumes:
      - ./data/mysql/:/var/lib/mysql

#  mysql-ecommerce-test1:
#    image: mysql:8.0
#    ports:
#      - "3307:3306"
#    environment:
#      - MYSQL_ROOT_PASSWORD=root
#      - MYSQL_USER=application
#      - MYSQL_PASSWORD=application
#      - MYSQL_DATABASE=ecommerce
#    volumes:
#      - ./data/mysql-test1/:/var/lib/mysql

#  mysql-ecommerce-test2:
#    image: mysql:8.0
#    ports:
#      - "3308:3306"
#    environment:
#      - MYSQL_ROOT_PASSWORD=root
#      - MYSQL_USER=application
#      - MYSQL_PASSWORD=application
#      - MYSQL_DATABASE=ecommerce
#    volumes:
#      - ./data/mysql-test2/:/var/lib/mysql

  redis:
    image: redis:7.0
    ports:
      - "6379:6379"

  zookeeper:
    image: bitnami/zookeeper:3.9.0
    container_name: zookeeper
    restart: always
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"

  kafka-1:
    image: bitnami/kafka:3.9.0
    ports:
      - "19092:19092"
    container_name: kafka-1
    depends_on:
      - zookeeper
    environment:
      KAFKA_CFG_BROKER_ID: 1
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      ALLOW_PLAINTEXT_LISTENER: yes
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:19092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:19092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT

  kafka-2:
    image: bitnami/kafka:3.9.0
    ports:
      - "19093:19093"
    container_name: kafka-2
    depends_on:
      - zookeeper
    environment:
      KAFKA_CFG_BROKER_ID: 2
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      ALLOW_PLAINTEXT_LISTENER: yes
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9093,EXTERNAL://:19093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9093,EXTERNAL://localhost:19093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT

  kafka-3:
    image: bitnami/kafka:3.9.0
    ports:
      - "19094:19094"
    container_name: kafka-3
    depends_on:
      - zookeeper
    environment:
      KAFKA_CFG_BROKER_ID: 3
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      ALLOW_PLAINTEXT_LISTENER: yes
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9094,EXTERNAL://:19094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9094,EXTERNAL://localhost:19094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "9000:8080"
    container_name: kafka-ui
    restart: always
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    environment:
      - KAFKA_CLUSTERS_0_NAME=local-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-1:9092,kafka-2:9093,kafka-3:9094
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
      - DYNAMIC_CONFIG_ENABLED=true

  springboot-app:
    build:
      context: . # 현재 디렉토리의 Dockerfile 사용
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 2G  # 메모리 2GB로 제한
          cpus: '2.0'  # CPU 2개 코어 사용
    container_name: springboot-app
    depends_on:
      - mysql
      - redis
      - kafka-1
      - kafka-2
      - kafka-3

  k6:
    image: grafana/k6
    volumes:
      - ./k6-scripts:/k6-scripts  # k6-scripts 디렉토리를 컨테이너에 마운트
    command: ["run", "/k6-scripts/load-test.js"]
    depends_on:
      - springboot-app  # springboot-app 이 먼저 실행된 후에 시작
    container_name: k6-load-test

networks:
  default:
    driver: bridge